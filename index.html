<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Cam</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; }
        
        /* Контейнер для видео */
        .camera-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Растягивает видео на весь экран */
        }
    </style>
</head>
<body>

<div class="camera-container">
    <video id="video" autoplay muted playsinline loop>
        <source src="https://rtmp.inforkom-relant.ru/live/camera50.m3u8" type="application/x-mpegURL">
        Ваш браузер не поддерживает видео.
    </video>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    // Настройка плеера для работы HLS (потокового видео) во всех браузерах
    var video = document.getElementById('video');
    var videoSrc = 'https://rtmp.inforkom-relant.ru/live/camera50.m3u8'; // Ссылка на поток

    if (Hls.isSupported()) {
        var hls = new Hls();
        hls.loadSource(videoSrc);
        hls.attachMedia(video);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = videoSrc;
    }
</script>

</body>
</html>
